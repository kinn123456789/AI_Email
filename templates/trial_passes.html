<div class="p-6">
    <h1 class="text-2xl font-bold mb-4">Trial Passes</h1>
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        {% for pass in passes %}
        <div class="bg-white p-4 rounded-lg shadow-md border border-gray-200">
            <h2 class="font-bold text-lg">Pass ID</h2>
            <p class="text-sm text-gray-600 truncate">{{ pass.free_trial_pass_id }}</p>
            <div class="mt-2">
                <span class="inline-block px-2 py-1 text-xs rounded 
                    {% if pass.status == 'revoked' %}bg-red-100 text-red-800{% else %}bg-green-100 text-green-800{% endif %}">
                    {{ pass.status }}
                </span>
            </div>
            <p class="text-xs text-gray-500 mt-2">Expires: {{ pass.expiry_at }}</p>
        </div>
        {% endfor %}
    </div>
</div>
