<!DOCTYPE html>
<html>
<head>
    <h1 class="text-4xl font-bold mb-8 text-[#0F5D7A]">
    Contact Form Enquiries
    </h1>
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>


<body
    class="min-h-screen p-10 font-sans text-stone-800"
    style="
        background-image: url('/static/background.png');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
    "
>

<a href="/"
   class="bg-[#0F5D7A] text-white px-4 py-2 rounded-lg">
   ← Back
</a>
<div class="max-w-3xl mx-auto">

    <h1 class="text-4xl font-bold mb-8 text-[#0F5D7A]">
         Contact Form Enquiries
    </h1>

    <div class="grid gap-6">

        {% for contact in contacts %}

        <div class="bg-white rounded-2xl shadow p-6">

            <div class="flex justify-between items-start">

                <div>
                    <h2 class="text-lg font-semibold">
                        Name: {{ contact.contact_name or contact.sender }}
                    </h2>

                    
                    
                </div>

                <div class="flex gap-2">

                    
                    <p class="text-gray-500 text-sm">
                        {{ contact.body }}
                    </p>

                    <span class="bg-blue-100 text-blue-700 px-3 py-1 rounded-full text-sm">
    {{ contact.category }}
</span>

<span class="bg-green-100 text-green-700 px-3 py-1 rounded-full text-sm">
    {{ contact.priority or "Normal" }}
</span>

                </div>

            </div>

            <div class="mt-4">

                <p class="text-gray-700">
                    {{ contact.body }}
                </p>

            </div>

            <div class="bg-slate-50 rounded-xl p-4 mt-4">
                <h4 class="font-semibold">AI Summary</h4>
                <p>{{ contact.ai_summary }}</p>
            </div>

            




</div>
{% endfor %}
</body>
</html>
