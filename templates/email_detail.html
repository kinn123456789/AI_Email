<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Review Email</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-4xl mx-auto bg-white p-6 rounded-lg shadow">
        <h1 class="text-2xl font-bold mb-4">Review: {{ email[2] }}</h1>
        
        <div class="mb-6 p-4 bg-blue-50 border-l-4 border-blue-500">
            <p class="font-bold">Sender: {{ email[1] }}</p>
            <p class="text-sm">Category: {{ email[4] }}</p>
            <p class="text-sm">Priority: {{ email[7] }}</p>
            <p class="text-sm">Status: {{ email[8] }}</p>
        </div>

        <div class="mb-6">
            <h2 class="font-semibold text-gray-700">Original Body:</h2>
            <div class="bg-gray-50 p-4 mt-2 rounded border">{{ email[3] }}</div>
        </div>

        <form action="/email/{{ email[0] }}/send" method="POST">
            <label class="block font-semibold text-gray-700">AI Draft Reply:</label>
            <textarea name="reply_body" class="w-full h-48 p-4 mt-2 border rounded" required>{{ email[6] }}</textarea>
            
            <div class="mt-4 flex gap-4">
                <button type="submit" class="bg-green-600 text-white px-6 py-2 rounded hover:bg-green-700">Send Reply</button>
                <a href="/dashboard" class="bg-gray-500 text-white px-6 py-2 rounded">Cancel</a>
            </div>
        </form>
    </div>
</body>
</html>
