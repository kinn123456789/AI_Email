<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>Teacher Conversations</title>

<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>

<body
class="min-h-screen p-8 font-sans"
style="background:url('/static/background.png') center/cover fixed no-repeat;">

<div class="max-w-5xl mx-auto">

    <div class="flex justify-between items-center mb-10">

        <div>

            <a
            href="/teachers"
            class="text-blue-700 font-semibold">
                ← Back
            </a>

            <h1 class="text-4xl font-bold text-[#0F5D7A] mt-3">
                👩‍🏫 {{ teacher_name }}
            </h1>

        </div>

    </div>

    <div class="space-y-5">

    {% for convo in conversations %}

        <a
        href="/conversation/{{ convo.chat_id }}"
        class="block">

        <div
        class="bg-white/40 backdrop-blur-xl rounded-2xl shadow-lg border border-white/40 p-6 hover:bg-white/50 transition">

            <div class="flex justify-between">

                <div>

                    <h2 class="text-xl font-bold">

                        👤 {{ convo.parent_name }}

                    </h2>

                    <p class="text-sm text-gray-500 mt-1">

                        {{ convo.body }}

                    </p>

                </div>

                <div class="text-right">

                    <div>

                    {% if convo.is_read %}
                        <span class="text-gray-500">
                            ✓ Read
                        </span>
                    {% else %}
                        <span class="text-blue-600 font-semibold">
                            ● Unread
                        </span>
                    {% endif %}

                    </div>

                    <div class="mt-2">

                        <span
                        class="
                        {% if convo.ai_priority == 'Urgent' %}
                            text-red-600
                        {% elif convo.ai_priority == 'High' %}
                            text-orange-600
                        {% elif convo.ai_priority == 'Medium' %}
                            text-yellow-600
                        {% else %}
                            text-green-600
                        {% endif %}
                        font-semibold">

                        {{ convo.ai_priority or "Normal" }}

                        </span>

                    </div>

                    <div class="mt-3 text-xs text-gray-500 local-time" data-utc="{{ convo.created_at.isoformat() }}"></div>

                </div>

            </div>

        </div>

        </a>

    {% endfor %}

    </div>

</div>

<script src="/static/local-time.js"></script>
</body>

</html>
